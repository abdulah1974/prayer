<div class="absolute inset-0 opacity-[0.06] pointer-events-none z-0 text-primary">
    <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <pattern id="square-grid" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">

                <rect
                    x="0"
